[project]
name = "mcpilot"
version = "0.1.0"
description = "MCP-based agentic Linux diagnostic assistant using Gemini, LangGraph, and typed sandboxed tools"
readme = "README.md"
authors = [
    { name = "Ronit-k", email = "ronitkumarnkrhiit@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-genai>=2.20.0",
    "langgraph>=1.2.11",
    "mcp[cli]>=2.1.1",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
]

[project.scripts]
mcpilot = "cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "cli", "client", "server"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
